# The self-hosted Forgejo that OC's review loop runs against.
#
# This file exists because both containers were originally created with raw
# `docker run`, which left the whole deployment unreproducible: nothing outside
# this directory recorded the ports, the volumes, or the FORGEJO__* settings.
# Moving the fleet to another machine would have meant reconstructing them from
# `docker inspect` on a box you no longer have.
#
# Reproduced verbatim from the live containers on Poyopo, 2026-08-19.
#
# The DATA is not here and cannot be: it lives in the two named volumes below.
# See "Moving to another machine" in README.md.

# Pin the compose project name. Without this compose derives it from the
# DIRECTORY it is invoked from, so the same file run from a migration bundle
# (`deploy-forgejo/`) and from the repo (`deploy/forgejo/`) produces two
# different projects that both want the fixed container_names below — the
# second invocation fails with "container name is already in use" instead of
# adopting the running stack. Pinning it makes the file location irrelevant.
name: forgejo

services:
  forgejo:
    image: codeberg.org/forgejo/forgejo:13
    container_name: forgejo
    restart: unless-stopped
    ports:
      - "3000:3000"
    volumes:
      - forgejo-data:/data
    environment:
      USER_UID: "1000"
      USER_GID: "1000"
      FORGEJO__database__DB_TYPE: sqlite3
      FORGEJO__service__DISABLE_REGISTRATION: "true"
      FORGEJO__actions__ENABLED: "true"
      # ROOT_URL is load-bearing for CI, not cosmetic. The runner hands this URL
      # to job containers for `actions/checkout`, so it must resolve INSIDE a
      # job container — which is why jobs run on the host network. Change this
      # and you must change `container.network` in runner-config.yml to match.
      FORGEJO__server__ROOT_URL: http://localhost:3000/
      FORGEJO__server__DISABLE_SSH: "true"

  runner:
    image: code.forgejo.org/forgejo/runner:6.3.1
    container_name: forgejo-runner
    restart: unless-stopped
    depends_on: [forgejo]
    command: ["forgejo-runner", "daemon", "--config", "/data/config.yml"]
    # The runner registers against the address in .runner, which is
    # http://localhost:3000. On a bridge network that resolves to the runner's
    # OWN localhost, so the daemon cannot reach the forge and dies before it
    # ever polls: "fail to invoke Declare ... dial tcp [::1]:3000: connect:
    # connection refused". Host networking makes that address mean the same
    # thing as FORGEJO__server__ROOT_URL above and as container.network: host
    # in runner-config.yml. All three are one decision; change one, change all.
    network_mode: host
    # Job containers are siblings on the host daemon, so the runner needs the
    # host docker socket (mounted below). That socket is root:docker 0660, and
    # the docker group's GID differs per machine -- so it comes from the
    # environment (deploy/forgejo/.env, gitignored) rather than being baked in.
    # Without it the daemon crash-loops on "permission denied ... docker.sock".
    group_add:
      - "${DOCKER_GID:?DOCKER_GID must be set: getent group docker | cut -d: -f3}"
    environment:
      HOME: /data
    volumes:
      - forgejo-runner-data:/data
      # The runner creates SIBLING containers on the host daemon rather than
      # nesting them, so it needs the host's docker socket. This is
      # root-equivalent access to the host: anything that can reach this socket
      # can start a privileged container. Acceptable only because this runner
      # executes code from a repo whose PRs are already trusted to merge.
      - /var/run/docker.sock:/var/run/docker.sock

volumes:
  forgejo-data:
    external: true
  forgejo-runner-data:
    external: true